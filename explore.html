<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore projects — NEXUS</title>
    <meta name="description" content="Browse every project on NEXUS — filter by category, chain, and stage; search and sort to find your next investment.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23e879f9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2304050c'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/vendor/lenis.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <section class="section" style="padding-top:calc(var(--nav-h) + 70px)">
        <div class="container">
            <div class="section-head reveal">
                <span class="eyebrow">Directory</span>
                <h2>Explore the <span class="text-gradient">frontier</span>.</h2>
                <p>Every project on NEXUS, live. Filter by what you invest in — connect with the teams behind it in one click.</p>
            </div>

            <div class="filter-bar reveal">
                <div class="filter-row" id="filter-categories"></div>
                <div class="filter-row">
                    <div class="search-wrap">
                        <span class="search-ico">⌕</span>
                        <input type="search" class="search-input" id="filter-search" placeholder="Search projects, pitches…">
                    </div>
                    <div class="select-wrap">
                        <select id="filter-chain"></select>
                    </div>
                    <div class="select-wrap">
                        <select id="filter-sort">
                            <option value="trending">Trending</option>
                            <option value="newest">Newest</option>
                            <option value="raising">Most raised</option>
                        </select>
                    </div>
                    <span class="results-count" id="results-count"></span>
                </div>
            </div>

            <div class="project-grid" id="explore-grid"></div>
        </div>
    </section>

    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/ScrollTrigger.min.js"></script>
    <script src="assets/vendor/lenis.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/explore.js"></script>
</body>
</html>
